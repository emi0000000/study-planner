<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Planificador de estudio">
  <title>Planificador de estudio</title>
  <defs>
    <!-- Fondo: degradado índigo → violeta -->
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <!-- Brillo suave arriba a la izquierda -->
    <radialGradient id="brillo" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Reloj: ámbar -->
    <linearGradient id="reloj" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Placa del icono -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#fondo)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#brillo)"/>

  <!-- Calendario con una marca de "hecho" -->
  <g filter="url(#sombra)">
    <rect x="46" y="62" width="138" height="132" rx="22" fill="#FFFFFF"/>
    <path d="M46 84a22 22 0 0 1 22-22h94a22 22 0 0 1 22 22v18H46z" fill="#E0E7FF"/>
    <rect x="76" y="46" width="14" height="34" rx="7" fill="#312E81"/>
    <rect x="140" y="46" width="14" height="34" rx="7" fill="#312E81"/>
    <path d="M80 146l22 22 44-48" fill="none" stroke="#4F46E5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Reloj: las sesiones cortas -->
  <g filter="url(#sombra)">
    <circle cx="184" cy="184" r="42" fill="url(#reloj)" stroke="#FFFFFF" stroke-width="9"/>
    <path d="M184 160v26l16 11" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
